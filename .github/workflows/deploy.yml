name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  configuration:
    name: Check deployment configuration
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Report whether deployment is configured
        id: check
        shell: bash
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$ACCOUNT_ID" && -n "$PROJECT_NAME" && -n "$API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare configuration is present. Deployment will follow successful tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: Cloudflare is not configured. No site has been published by this workflow." >> "$GITHUB_STEP_SUMMARY"
            echo "Set repository variables CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PROJECT_NAME, and repository secret CLOUDFLARE_API_TOKEN. Then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Publish frontend to Cloudflare Pages
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Deploy prebuilt frontend and Pages Functions
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: "4.157.0"
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
